const sb = supabase.createClient(SUPABASE_URL, SERVICE_KEY, {

async function fixRLS() {
  console.log('Checking barbers table RLS...');

  // Check if RLS is enabled
  var { data: rlsStatus } = await sb.rpc('pg_tables_is_rls_enabled', { table_name: 'barbers' });
  console.log('RLS status for barbers:', rlsStatus);

  // Try to disable RLS
  try {
    await sb.from('barbers').update({ name: 'test' }).eq('id', '00000000-0000-0000-0000-000000000000');
  } catch(e) {
    console.log('Update test error:', e.message);
  }

  // Try delete
  try {
    await sb.from('barbers').delete().eq('id', '00000000-0000-0000-0000-000000000000');
  } catch(e) {
    console.log('Delete test error:', e.message);
  }

  console.log('Done. Check console for errors.');
}

fixRLS();
